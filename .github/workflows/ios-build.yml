name: Build iOS IPA

on:
  push:
    branches:
      - PREVIEW
  pull_request:
    branches:
      - PREVIEW
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci
        working-directory: apps/movil

      - name: Sync Capacitor for iOS
        run: npx cap sync ios
        working-directory: apps/movil

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath $PWD/build/App.xcarchive \
            archive
        working-directory: apps/movil/ios/App

      - name: Package to .ipa
        run: |
          mkdir -p Payload
          mv App.xcarchive/Products/Applications/App.app Payload/
          zip -r commercity-ios.ipa Payload
        working-directory: apps/movil/ios/App/build

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CommerCity-iOS-IPA
          path: apps/movil/ios/App/build/commercity-ios.ipa
